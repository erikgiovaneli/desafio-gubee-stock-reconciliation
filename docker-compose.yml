version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gubee-postgres
    environment:
      POSTGRES_DB: gubee_stock
      POSTGRES_USER: gubee_user
      POSTGRES_PASSWORD: gubee_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: