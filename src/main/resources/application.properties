spring.application.name=gubee-stock-reconciliation

# Configurações do Banco de Dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/gubee_stock
spring.datasource.username=gubee_user
spring.datasource.password=gubee_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Estratégia de criação das tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true